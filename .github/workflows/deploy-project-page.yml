name: Deploy project page

on:
  push:
    branches:
      - main
    paths:
      - "project_page/**"
      - ".github/workflows/deploy-project-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload project page
        uses: actions/upload-pages-artifact@v4
        with:
          path: project_page

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4